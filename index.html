<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI Chatbot</title>
    <style>
        /* ডিজাইন ফিক্স এবং মোবাইল অপ্টিমাইজেশন */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: #2d2d2d;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 10px;
            background: #3d3d3d;
            text-align: center;
            border-bottom: 1px solid #444;
            z-index: 10;
        }

        header h2 { margin: 5px 0; font-size: 1.1rem; color: #00d2ff; }

        #api-key {
            width: 90%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: #00ff00;
            font-size: 12px;
            outline: none;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #2d2d2d;
        }

        .message {
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 15px;
        }

        .user {
            background: #007bff;
            align-self: flex-end;
            color: white;
        }

        .ai {
            background: #444;
            align-self: flex-start;
            white-space: pre-wrap;
        }

        .input-area {
            padding: 10px;
            display: flex;
            gap: 8px;
            background: #3d3d3d;
            border-top: 1px solid #444;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #eee;
            color: #333;
            font-size: 16px;
        }

        button {
            padding: 8px 18px;
            background: #00d2ff;
            color: #1a1a1a;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h2>Personal Gemini AI</h2>
            <input type="password" id="api-key" placeholder="Paste your Gemini API Key...">
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message ai">হ্যালো! আমি আপনার AI। উপরে API Key দিয়ে কথা বলা শুরু করুন।</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');

        if(localStorage.getItem('gemini_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_key');
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text || !apiKey) return;

            localStorage.setItem('gemini_key', apiKey);
            appendMessage('user', text);
            userInput.value = '';

            const typingDiv = appendMessage('ai', 'Thinking...');

            try {
                // v1beta এর বদলে v1 ব্যবহার এবং মডেলের নামের সঠিক ফরম্যাট
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    typingDiv.innerText = "Error: " + data.error.message;
                } else {
                    const aiText = data.candidates[0].content.parts[0].text;
                    typingDiv.innerText = aiText;
                }
            } catch (err) {
                typingDiv.innerText = "Error: API Key বা ইন্টারনেট সমস্যা।";
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
