<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed Gemini AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #242424;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        header {
            padding: 15px;
            background: #333;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        #api-key {
            width: 90%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #111;
            color: #00ff00;
            font-size: 12px;
            margin-top: 10px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.5;
        }
        .user { background: #007bff; align-self: flex-end; }
        .ai { background: #444; align-self: flex-start; white-space: pre-wrap; }
        .input-area {
            padding: 15px;
            background: #333;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: #eee;
            color: #333;
            outline: none;
        }
        #send-btn {
            padding: 10px 20px;
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <header>
        <h2 style="margin:0; color:#00d2ff;">Gemini AI Chat</h2>
        <input type="password" id="api-key" placeholder="Enter API Key here...">
    </header>
    <div id="chat-box" class="chat-box">
        <div class="message ai">হ্যালো! আমি ঠিক হয়ে গেছি। দয়া করে আপনার API Key টি দিন এবং কথা বলা শুরু করুন।</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type here...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key');

    if(localStorage.getItem('gemini_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_key');
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text || !apiKey) return;

        localStorage.setItem('gemini_key', apiKey);
        appendMessage('user', text);
        userInput.value = '';

        const typingDiv = appendMessage('ai', 'ভেবে দেখছি...');

        try {
            // আমরা সরাসরি v1 ব্যবহার করছি যা সবচেয়ে স্ট্যাবল
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                // যদি ফ্ল্যাশ মডেল কাজ না করে, তবে প্রো মডেল চেষ্টা করবে
                if (data.error.message.includes("not found")) {
                    tryProModel(text, apiKey, typingDiv);
                } else {
                    typingDiv.innerText = "Error: " + data.error.message;
                }
            } else {
                typingDiv.innerText = data.candidates[0].content.parts[0].text;
            }
        } catch (err) {
            typingDiv.innerText = "Connection Error! আপনার ইন্টারনেট চেক করুন।";
        }
    }

    async function tryProModel(text, apiKey, typingDiv) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });
            const data = await response.json();
            typingDiv.innerText = data.candidates[0].content.parts[0].text;
        } catch (err) {
            typingDiv.innerText = "Error: কোনো মডেলই খুঁজে পাওয়া যাচ্ছে না। আপনার API Key টি চেক করুন।";
        }
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>

</body>
</html>
