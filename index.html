<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Gemini AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        header {
            padding: 15px;
            background: #252525;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        header h2 { margin: 0 0 10px 0; color: #00d2ff; font-size: 1.2rem; }
        #api-key {
            width: 90%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #00ff00;
            font-size: 12px;
            outline: none;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.4;
        }
        .user { background: #007bff; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .ai { background: #333; align-self: flex-start; color: #e0e0e0; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        .input-area {
            padding: 15px;
            background: #252525;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: none;
            background: #333;
            color: white;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background: #00d2ff;
            color: #121212;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <header>
        <h2>Personal Gemini AI</h2>
        <input type="password" id="api-key" placeholder="Paste Gemini API Key here...">
    </header>
    
    <div id="chat-box" class="chat-box">
        <div class="message ai">হ্যালো! আমি আপনার AI। উপরে API Key দিয়ে কথা বলা শুরু করুন।</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask me anything...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key');

    if(localStorage.getItem('gemini_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_key');
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text || !apiKey) return;

        localStorage.setItem('gemini_key', apiKey);
        appendMessage('user', text);
        userInput.value = '';

        const typingDiv = appendMessage('ai', 'Thinking...');

        try {
            // Updated to v1 Stable and Correct Model Name
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                typingDiv.innerText = "Error: " + data.error.message;
            } else {
                const aiText = data.candidates[0].content.parts[0].text;
                typingDiv.innerText = aiText;
            }
        } catch (err) {
            typingDiv.innerText = "Error: ইন্টারনেট কানেকশন বা API Key চেক করুন।";
        }
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>

</body>
</html>
